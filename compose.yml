name: pos

x-app: &app
  build:
    context: .
    target: production
  image: pos-app:latest
  env_file:
    - .env
  volumes:
    - pos_storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    restart: unless-stopped

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - pos_database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      target: web
    image: pos-web:latest
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      - app
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - pos_storage:/var/www/html/storage:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pos_database:
  pos_storage:
  caddy_data:
  caddy_config:
